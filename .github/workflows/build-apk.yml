name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check APP_URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL variable is empty. Add it in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Put dashboard link in config
        run: sed -i "s|__APP_URL__|$APP_URL|" capacitor.config.json

      - name: Create Android project
        run: npx cap add android

