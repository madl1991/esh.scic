name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check APP_URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL variable is empty. Add it in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Put dashboard link in config
        run: sed -i "s|__APP_URL__|$APP_URL|" capacitor.config.json

      - name: Create Android project
        run: npx cap add android

      - name: Make icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#007838' --iconBackgroundColorDark '#007838'

      - name: Make icon background transparent
        run: |
          cat > android/app/src/main/res/values/ic_launcher_background.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#00000000</color>
          </resources>
          XML

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: apk/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SCIC-ESH-Executive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SCIC-ESH-Executive-APK
          path: apk/SCIC-ESH-Executive.apk
