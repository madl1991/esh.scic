      - name: Make icons
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#007838' --iconBackgroundColorDark '#007838' 2>&1 | tee icons.log
          if grep -q "No assets found" icons.log; then
            echo "ICON NOT FOUND."
            exit 1
          fi

      - name: Make icon with transparent background (no adaptive icon)
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > make-icons.js << 'JS'
          const sharp = require('sharp');
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            const src = await sharp('assets/icon-foreground.png').trim().toBuffer();
            for (const [d, s] of Object.entries(sizes)) {
              const inner = Math.round(s * 0.92);
              const img = await sharp(src).resize(inner, inner, { fit: 'inside' }).toBuffer();
              for (const n of ['ic_launcher', 'ic_launcher_round']) {
                await sharp({ create: { width: s, height: s, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
                  .composite([{ input: img, gravity: 'center' }])
                  .png()
                  .toFile('android/app/src/main/res/mipmap-' + d + '/' + n + '.png');
              }
            }
          })();
          JS
          node make-icons.js
          echo "--- adaptive icon files (must be empty):"
          ls $RES/mipmap-anydpi-v26
          ls -l $RES/mipmap-xxxhdpi

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: apk/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SCIC-ESH-Executive-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SCIC-ESH-Executive-APK
          path: apk/SCIC-ESH-Executive-${{ github.run_number }}.apk
